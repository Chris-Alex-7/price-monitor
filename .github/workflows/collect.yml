name: Collect prices

on:
  schedule:
    # Every day at 03:17 UTC (06:17 Greek summer time). GitHub often starts scheduled jobs hours late,
    # especially on the hour, so this is early and off the hour.
    - cron: "17 3 * * *"
  workflow_dispatch: # adds the manual "Run workflow" button

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 collect.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
